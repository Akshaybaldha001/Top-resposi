
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Booking Form</title>
  <link rel="stylesheet" href="car booking.css">
</head>
<body>
    <div class="background">
        <div class="booking-form">
            <h2>Travel Booking Form</h2>
            <form action="" method="post">
                <label for="name">Name:</label>
                <input type="text" name="name" id="name" required>
 
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" required>
           
                <label for="destination">Destination:</label>
                <input type="text" name="destination" id="destination" required>

                <label for="code">Booking code</label>
                <input type="number" name="code" id="code" required>
           
                <label for="departure-date">Departure Date:</label>
                <input type="date" name="departure-date" id="departure-date" required>
               
                <label for="return-date">Return Date:</label>
                <input type="date" name="return-date" id="return-date" required>

                <button type="submit">Book Now</button>
            </form>
        </div>
    </div>
    <div id="user-list"></div>

</body>
<script>

  document.addEventListener('DOMContentLoaded', () => {
    const form = document.querySelector('form');
    const userList = document.querySelector('#user-list');

    // Load users from localStorage
    const loadUsers = () => {
      userList.innerHTML = ''; // Clear existing list
      const users = JSON.parse(localStorage.getItem('users')) || [];
      users.forEach(user => {
        const li = document.createElement('li');
        li.textContent = `${user.name} (${user.email}) - ${user.destination} - ${user.code} - ${user.departureDate} to ${user.returnDate}`;
        const editButton = document.createElement('button');
        editButton.textContent = 'Edit';
        editButton.onclick = () => editUser(user);
        const deleteButton = document.createElement('button');
        deleteButton.textContent = 'Delete';
        deleteButton.onclick = () => deleteUser(user.code);

        li.appendChild(editButton);
        li.appendChild(deleteButton);
        userList.appendChild(li);
      });
    };

    // Create or update user
    const saveUser = (user) => {
      const users = JSON.parse(localStorage.getItem('users')) || [];
      const existingUserIndex = users.findIndex(u => u.code === user.code);
      if (existingUserIndex >= 0) {
        users[existingUserIndex] = user;
      } else {
        users.push(user);
      }
      localStorage.setItem('users', JSON.stringify(users));
      loadUsers();
    };

    // Edit user
    const editUser = (user) => {
      document.querySelector('#name').value = user.name;
      document.querySelector('#email').value = user.email;
      document.querySelector('#destination').value = user.destination;
      document.querySelector('#code').value = user.code;
      document.querySelector('#departure-date').value = user.departureDate;
      document.querySelector('#return-date').value = user.returnDate;
      form.onsubmit = (event) => {
        event.preventDefault();
        const updatedUser = {
          name: document.querySelector('#name').value,
          email: document.querySelector('#email').value,
          destination: document.querySelector('#destination').value,
          code: parseInt(document.querySelector('#code').value, 10),
          departureDate: document.querySelector('#departure-date').value,
          returnDate: document.querySelector('#return-date').value
        };
        saveUser(updatedUser);
        form.reset();
        form.onsubmit = handleSubmit; // Reset form submission to default
      };
    };

    // Delete user
    const deleteUser = (code) => {
      let users = JSON.parse(localStorage.getItem('users')) || [];
      users = users.filter(user => user.code !== code);
      localStorage.setItem('users', JSON.stringify(users));
      loadUsers();
    };

    // Handle form submission
    const handleSubmit = (event) => {
      event.preventDefault();
      const user = {
        name: document.querySelector('#name').value,
        email: document.querySelector('#email').value,
        destination: document.querySelector('#destination').value,
        code: parseInt(document.querySelector('#code').value, 10),
        departureDate: document.querySelector('#departure-date').value,
        returnDate: document.querySelector('#return-date').value
      };
      saveUser(user);
      form.reset();
    };

    form.onsubmit = handleSubmit;
    loadUsers();
  });


</script>
</html>
